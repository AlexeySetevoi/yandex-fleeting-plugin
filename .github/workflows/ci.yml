name: ci

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: fmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: |
          go test ./... -count=1 -race -coverprofile=coverage.out
          go tool cover -func=coverage.out | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          MODULE_PATH: github.com/AlexeySetevoi/yandex-fleeting-plugin
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w \
            -X '${MODULE_PATH}.VERSION=${VERSION}' \
            -X '${MODULE_PATH}.REVISION=${GITHUB_SHA::8}' \
            -X '${MODULE_PATH}.REFERENCE=${GITHUB_REF_NAME}' \
            -X '${MODULE_PATH}.BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o "dist/fleeting-plugin-yandex-${GOOS}-${GOARCH}" \
            ./cmd/fleeting-plugin-yandex
      # deb/rpm только для linux; отдельным шагом без GOOS/GOARCH, иначе
      # nfpm соберётся под целевую архитектуру и не запустится
      - name: package
        if: matrix.goos == 'linux'
        env:
          ARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        run: |
          mkdir -p pkg
          cp "dist/fleeting-plugin-yandex-linux-${ARCH}" pkg/fleeting-plugin-yandex
          for packager in deb rpm; do
            go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0 pkg --packager "$packager" --target dist/
          done
          ls -l dist/
      - uses: actions/upload-artifact@v7
        with:
          name: fleeting-plugin-yandex-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # подпись происхождения (Sigstore, без своих ключей): проверяется
      # через gh attestation verify
      - uses: actions/attest@v4
        with:
          subject-path: dist/*
      # одной командой: с immutable releases после публикации файлы уже не
      # добавить, gh сам создаёт черновик, грузит файлы и только потом публикует
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
