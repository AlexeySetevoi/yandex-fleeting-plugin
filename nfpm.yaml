# deb/rpm с плагином; VERSION и ARCH (amd64/arm64) задаёт CI.
# nfpm не подставляет переменные в contents.src, поэтому бинарь нужной
# архитектуры перед сборкой пакета копируется в pkg/.
name: fleeting-plugin-yandex
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: Alexey <alexeysetevoi@gmail.com>
description: GitLab Runner fleeting plugin for Yandex Compute Cloud
homepage: https://github.com/AlexeySetevoi/yandex-fleeting-plugin

contents:
  # в /usr/bin раннер находит плагин по имени: plugin = "fleeting-plugin-yandex"
  - src: pkg/fleeting-plugin-yandex
    dst: /usr/bin/fleeting-plugin-yandex
    file_info:
      mode: 0755
